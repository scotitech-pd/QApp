# OnQ on Enterprise-Portal host — everything containerized, localhost-only.
# Lives at ~/onq/app; run with: docker compose -f deploy/docker-compose.yml up -d
name: onq
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onq
      POSTGRES_PASSWORD: ${ONQ_DB_PASSWORD:?set in .env}
      POSTGRES_DB: onq
    volumes:
      - onq-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onq -d onq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://onq:${ONQ_DB_PASSWORD}@db:5432/onq
      DIRECT_URL: postgresql://onq:${ONQ_DB_PASSWORD}@db:5432/onq
      HOST: 0.0.0.0
      PORT: "4000"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://onq.scotitech.com
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api
    mem_limit: 512m

volumes:
  onq-pgdata:
